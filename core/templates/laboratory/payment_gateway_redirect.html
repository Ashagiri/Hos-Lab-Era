<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting to {{ gateway_name }}...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">

    <div class="text-center">
        <div class="spinner-border text-primary mb-3" role="status" style="width:3rem;height:3rem;"></div>
        <h5 class="fw-bold text-dark">Redirecting you to {{ gateway_name }}...</h5>
        <p class="text-muted">Please do not close or refresh this window.</p>
    </div>

    <form id="gatewayForm" action="{{ action_url }}" method="POST">
        {% for key, value in fields.items %}
        <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endfor %}
    </form>

    <script>
        document.getElementById('gatewayForm').submit();
    </script>
</body>
</html>
