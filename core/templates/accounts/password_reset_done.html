{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HLMS - Check Your Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
      body, html {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .bg-overlay-wrapper {
        background-image: url("{% static 'fff.jpg' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 15px;
      }

      .form-card {
        background-color: rgba(255, 255, 255, 0.96);
        border-radius: 12px;
        width: 100%;
        max-width: 480px;
        padding: 45px 40px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      .card-title-accent {
        color: #0b5ed7;
        font-weight: 700;
      }

      .btn-primary-action {
        background-color: #0d6efd;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        height: 45px;
        font-weight: 600;
        font-size: 1rem;
        transition: background-color 0.2s ease;
      }

      .btn-primary-action:hover {
        background-color: #0b5ed7;
        color: #ffffff;
      }
    </style>
  </head>
  <body>

<div class="bg-overlay-wrapper">
  <div class="form-card">
    <div class="fs-1 text-success mb-3"><i class="fa-solid fa-circle-check"></i></div>
    <h3 class="card-title-accent mb-3">Check Your Email</h3>
    <p class="text-muted mb-4">
      If an account exists with the email address you entered, we've sent a link to reset your password.
      Please check your inbox (and spam folder) — the link will expire after a short time.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary-action d-inline-flex align-items-center justify-content-center gap-2 shadow-sm px-4">
      <i class="fa-solid fa-right-to-bracket"></i> Back to Sign In
    </a>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
