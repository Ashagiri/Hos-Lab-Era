{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HLMS - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
      body, html {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .bg-overlay-wrapper {
        background-image: url("{% static 'fff.jpg' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 15px;
      }

      .form-card {
        background-color: rgba(255, 255, 255, 0.96);
        border-radius: 12px;
        width: 100%;
        max-width: 480px;
        padding: 45px 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      .card-title-accent {
        color: #0b5ed7;
        font-weight: 700;
      }

      .field-label {
        font-weight: 600;
        color: #495057;
        font-size: 0.9rem;
        margin-bottom: 6px;
      }

      .input-group-custom {
        display: flex;
        align-items: center;
        border: 1px solid #ced4da;
        border-radius: 6px;
        background-color: #ffffff;
        height: 44px;
        overflow: hidden;
      }

      .input-group-custom:focus-within {
        border-color: #86b7fe;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
      }

      .input-group-custom .icon-addon {
        color: #6c757d;
        width: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 1px solid #e9ecef;
      }

      .input-group-custom .form-control-clean {
        border: none;
        outline: none;
        width: 100%;
        padding: 0 12px;
        color: #212529;
        font-size: 0.95rem;
        background: transparent;
      }

      .btn-primary-action {
        background-color: #0d6efd;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        height: 45px;
        font-weight: 600;
        font-size: 1rem;
        transition: background-color 0.2s ease;
      }

      .btn-primary-action:hover {
        background-color: #0b5ed7;
      }

      .redirect-footer-link {
        color: #0d6efd;
        text-decoration: none;
        font-weight: 500;
      }

      .redirect-footer-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>

<div class="bg-overlay-wrapper">
  <div class="form-card">

    <div class="d-flex align-items-center gap-3 mb-3">
      <div class="fs-2 text-primary"><i class="fa-solid fa-key"></i></div>
      <h3 class="m-0 card-title-accent">Reset Password</h3>
    </div>

    <p class="text-muted small mb-4">
      Enter the email address linked to your account and we'll send you a link to reset your password.
    </p>

    {% if form.errors %}
      <div class="alert alert-danger py-2 small">
        Please enter a valid email address.
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="mb-4">
        <label class="field-label">Email :</label>
        <div class="input-group-custom">
          <div class="icon-addon"><i class="fa-solid fa-envelope"></i></div>
          <input type="email" name="email" class="form-control-clean" placeholder="Enter your account email" required autocomplete="email">
        </div>
      </div>

      <div class="d-grid gap-3">
        <button class="btn btn-primary-action d-flex align-items-center justify-content-center gap-2 shadow-sm" type="submit">
          <i class="fa-solid fa-paper-plane"></i> Send Reset Link
        </button>

        <div class="text-center text-muted small mt-1">
          Remembered your password?
          <a href="{% url 'login' %}" class="redirect-footer-link ms-1">Back to Sign In</a>
        </div>
      </div>
    </form>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
